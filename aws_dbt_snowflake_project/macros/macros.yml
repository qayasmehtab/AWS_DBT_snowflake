version: 2

macros:
  - name: multiply
    description: "Multiplies two values (x and y) and rounds the result to a specified precision (default 2)."
    arguments:
      - name: x
        type: numeric
        description: "The first value to multiply."
      - name: y
        type: numeric
        description: "The second value to multiply."
      - name: precision
        type: integer
        description: "The number of decimal places to round to."

  - name: tag
    description: "Categorizes a column value into 'low', 'medium', or 'high' based on predefined price thresholds."
    arguments:
      - name: col
        type: numeric
        description: "The column to be categorized."

  - name: trimmer
    description: "Trims whitespace and converts a column's text to uppercase."
    arguments:
      - name: column_name
        type: string
        description: "The column to be formatted."
