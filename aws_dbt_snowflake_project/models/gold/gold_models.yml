version: 2

models:
  - name: obt
    description: "The 'One Big Table' (Gold Layer) joining bookings, listings, and hosts for comprehensive analytics and reporting."
    columns:
      - name: booking_id
        description: "Unique identifier for the booking."
        tests:
          - unique
          - not_null
      - name: listing_id
        description: "Unique identifier for the listing."
        tests:
          - not_null
      - name: booking_date
        description: "The date of the booking."
      - name: total_amount
        description: "Total amount calculated for the stay."
      - name: booking_status
        description: "Status of the booking."
      - name: host_name
        description: "The name of the property host."
      - name: city
        description: "City where the property is located."
      - name: country
        description: "Country where the property is located."
      - name: price_level
        description: "Categorized price level of the listing."
      - name: booking_created_at
        description: "Processing timestamp for the booking record."
